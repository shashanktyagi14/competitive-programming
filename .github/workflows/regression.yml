name: C++ regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check generated contest index
        run: |
          python3 tools/generate_index.py
          git diff --exit-code -- docs/INDEX.md
      - name: Run sample regression suite
        run: python3 tools/run_samples.py
